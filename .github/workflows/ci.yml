name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS build and authentication tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and run tests
        run: ./test.sh

  collector:
    name: Linux collector tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test the collector and live Linux CPU sampling
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
